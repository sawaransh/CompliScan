<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CompliScan — Sign in</title>
<link rel="stylesheet" href="/static/landing.css">
</head>
<body>
<div class="landing">
  <div class="login-card">
    <div class="login-mark">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.5 12 2.3 2.3L16 9.3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>CompliScan</h1>
    <p>Scan. Verify. Ensure fair trade.</p>

    <div class="role-tabs" id="role-tabs">
      <span class="role-slider" id="role-slider"></span>
      <button type="button" class="role-btn active" data-role="officer">Officer</button>
      <button type="button" class="role-btn" data-role="supervisor">Supervisor</button>
    </div>

    <form id="landing-form">
      <div class="field">
        <label for="li-id" id="li-id-label">Officer ID</label>
        <input id="li-id" placeholder="Enter your ID" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="li-secret" id="li-secret-label">Full name</label>
        <input id="li-secret" type="text" placeholder="Enter your full name" autocomplete="current-password" required>
      </div>
      <div class="form-error hidden" id="form-error"></div>
      <button type="submit" class="btn btn-gradient" id="signin-btn">Sign in as Officer</button>
    </form>

    <div class="demo-hint" id="demo-hint"></div>
    <div class="gov-tag">Department of Consumer Affairs<br>Government of India</div>
  </div>
</div>
<script src="/static/landing.js"></script>
</body>
</html>
